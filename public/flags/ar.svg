<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle-ar">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-ar)">
    <!-- Green top bar -->
    <rect x="28" y="0" width="72" height="33.333" fill="#00732F"/>
    <!-- White middle bar -->
    <rect x="28" y="33.333" width="72" height="33.334" fill="#FFFFFF"/>
    <!-- Black bottom bar -->
    <rect x="28" y="66.667" width="72" height="33.333" fill="#000000"/>
    <!-- Red vertical hoist bar -->
    <rect x="0" y="0" width="28" height="100" fill="#E4002B"/>
  </g>
</svg>
