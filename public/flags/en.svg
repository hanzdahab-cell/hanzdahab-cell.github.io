<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle-uk">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <clipPath id="saltire-ne-sw">
      <path d="M0,0 L100,100 M100,0 L0,100" />
    </clipPath>
  </defs>
  <g clip-path="url(#circle-uk)">
    <!-- Navy base -->
    <rect width="100" height="100" fill="#012169"/>
    
    <!-- Diagonal white broad saltire -->
    <line x1="0" y1="0" x2="100" y2="100" stroke="#FFFFFF" stroke-width="20"/>
    <line x1="100" y1="0" x2="0" y2="100" stroke="#FFFFFF" stroke-width="20"/>
    
    <!-- Diagonal red saltire (counterchanged) -->
    <!-- Top-left to center -->
    <polygon points="0,0 5,0 50,45 45,50" fill="#C8102E"/>
    <!-- Center to bottom-right -->
    <polygon points="50,50 55,50 100,95 100,100 95,100 50,55" fill="#C8102E"/>
    <!-- Top-right to center -->
    <polygon points="100,0 100,5 55,50 50,45" fill="#C8102E"/>
    <!-- Center to bottom-left -->
    <polygon points="50,55 45,50 0,95 0,100 5,100 50,55" fill="#C8102E"/>

    <!-- Central white cross -->
    <rect x="38" y="0" width="24" height="100" fill="#FFFFFF"/>
    <rect x="0" y="38" width="100" height="24" fill="#FFFFFF"/>

    <!-- Central red cross (St George) -->
    <rect x="42" y="0" width="16" height="100" fill="#C8102E"/>
    <rect x="0" y="42" width="100" height="16" fill="#C8102E"/>
  </g>
</svg>
